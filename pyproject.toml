[project]
name = "pong-ai-bot"
version = "0.1.0"
description = "A locally built Pong game and a DQN Agent that learns to play it from pixels."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "gymnasium==1.4.0",
    "numpy==2.5.5",
    "pygame-ce==2.5.8",
    "tensorboard==2.21.0",
    "torch==2.14.1",
]

[project.scripts]
pong = "pong_ai_bot.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.*",
    "pytest==9.2.*",
    "ruff==0.17.*",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv]
# The project runs only on Windows, so the lock resolves only for Windows.
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
# cu126 is the last PyTorch build with sm_61, the Quadro P2200 (issue #2).
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not slow"]
markers = ["slow: slow tests, left out by default; run them with `pytest -m slow`"]

[tool.ruff.lint]
extend-select = ["I", "B"]

[tool.mypy]
files = ["src", "tests"]
disallow_untyped_defs = true
